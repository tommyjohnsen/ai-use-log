[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-use-log"
version = "0.1.0"
description = "Append-only records of AI tool use"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ail = "ai_use_log.cli:main"

[tool.setuptools.package-data]
ai_use_log = ["default_schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
